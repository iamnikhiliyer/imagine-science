name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run doctor
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Render review evidence
        run: npm run review -- 0 180 359
      - name: Render and verify the starter
        run: npm run render && npm run verify && npm run contact-sheet
